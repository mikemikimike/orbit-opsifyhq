{{- if and .Values.networkPolicy.enabled .Values.launcher.enabled }}
# The launcher can create workloads, so only orbit-api may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orbit.fullname" . }}-launcher
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
spec:
  podSelector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: launcher
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "orbit.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8090
{{- end }}
