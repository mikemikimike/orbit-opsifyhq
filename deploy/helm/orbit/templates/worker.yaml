{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.fullname" . }}-worker
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- if or .Values.podAnnotations .Values.secrets.create }}
      annotations:
        {{- if .Values.secrets.create }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orbit.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "orbit.image" (dict "root" . "registry" .Values.imageRegistry "image" .Values.worker.image "tag" .Values.worker.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: ORBIT_ENV
              value: {{ .Values.platform.environment | quote }}
            - name: ORBIT_API_URL
              value: "http://{{ include "orbit.apiHost" . }}:{{ .Values.api.port }}"
            - name: ORBIT_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: worker-token
            - name: ORBIT_WORKER_HARNESSES
              value: {{ .Values.worker.harnesses | quote }}
            - name: ORBIT_WORKER_TARGET
              value: "kubernetes"
            - name: ORBIT_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: ORBIT_WORKER_POLL_MS
              value: {{ .Values.worker.pollIntervalMs | quote }}
            - name: ORBIT_MAX_APPROVAL_WAIT_SECONDS
              value: {{ .Values.maxApprovalWaitSeconds | quote }}
            - name: ORBIT_WORKSPACE_ROOT
              value: "/tmp/orbit-workspaces"
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.platform.logFormat | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: ORBIT_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: ORBIT_OIDC_AUDIENCE
              value: {{ .Values.auth.oidc.audience | quote }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
            {{- if .Values.caCertificates.enabled }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/ca-bundle.crt"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/ca-bundle.crt"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/ssl/certs/ca-bundle.crt"
            - name: GIT_SSL_CAINFO
              value: "/etc/ssl/certs/ca-bundle.crt"
            {{- end }}
          volumeMounts:
            {{- if .Values.caCertificates.enabled }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: {{ .Values.caCertificates.key }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- if .Values.caCertificates.enabled }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caCertificates.secretName }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.worker.workspace.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
