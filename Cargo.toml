[workspace]
resolver = "2"
members = [
  "crates/orbit-domain",
  "crates/orbit-contracts",
  "crates/orbit-store",
  "crates/orbit-events",
  "crates/orbit-security",
  "crates/orbit-harness",
  "crates/orbit-api",
  "services/api",
  "services/worker",
  "services/launcher",
  "services/mcp-broker",
  "services/license-cli",
]

[workspace.package]
version = "0.21.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/opsifyhq/orbit"

[workspace.dependencies]
orbit-domain = { path = "crates/orbit-domain" }
orbit-contracts = { path = "crates/orbit-contracts" }
orbit-store = { path = "crates/orbit-store" }
orbit-events = { path = "crates/orbit-events" }
orbit-security = { path = "crates/orbit-security" }
orbit-harness = { path = "crates/orbit-harness" }
orbit-api = { path = "crates/orbit-api" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-stream = "0.3"
dotenvy = "0.15"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit", "timeout"] }
http = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde_yaml = "0.9"
async-nats = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
libc = "0.2"
croner = "4"
regex = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
